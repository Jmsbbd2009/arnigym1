name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [arniygym, arniygym-admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function type check
        working-directory: arniygym/supabase
        run: echo '{"nodeModulesDir":"auto"}' > deno.json && deno check functions/*/index.ts
      - name: Edge Function unit tests
        working-directory: arniygym
        run: deno test -A --no-check supabase/tests/news_image_test.ts
      - name: Schema + RLS tests (fresh install and re-run)
        working-directory: arniygym/supabase
        run: |
          psql -v ON_ERROR_STOP=1 -q -f tests/supabase_stub.sql
          psql -v ON_ERROR_STOP=1 -q -f schema.sql
          psql -v ON_ERROR_STOP=1 -q -f schema.sql
          psql -v ON_ERROR_STOP=1 -q -f tests/news_rls_test.sql
      - name: Python and shell syntax
        run: |
          python3 -m py_compile arniygym/telegram_bot/bot.py
          for f in start.sh scripts/sync-admin-shared.sh arniygym/run-local.sh tests/e2e/run.sh; do bash -n "$f"; done
