[build]
command = "npm ci && npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "20"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Robots-Tag = "noindex, nofollow, noarchive"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=()"
Cross-Origin-Opener-Policy = "same-origin-allow-popups"
Content-Security-Policy = "default-src 'self'; base-uri 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://app.lemonsqueezy.com https://*.lemonsqueezy.com; script-src 'self' https://challenges.cloudflare.com https://app.lemonsqueezy.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co https://*.cloudflarestream.com; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com https://*.cloudflarestream.com https://app.lemonsqueezy.com https://*.lemonsqueezy.com; media-src 'self' blob: https://*.cloudflarestream.com; frame-src 'self' https://challenges.cloudflare.com https://app.lemonsqueezy.com https://*.lemonsqueezy.com https://*.cloudflarestream.com; upgrade-insecure-requests"
